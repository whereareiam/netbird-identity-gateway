name: Development build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.details.outputs.version }}
    steps:
      - name: Extract development version
        id: details
        run: |
          branch_name="${GITHUB_REF_NAME//\//-}"
          echo "version=${branch_name}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
      - run: go test -race ./...
      - run: go vet ./...

  build:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: netbird-identity-gateway
            dockerfile: Dockerfile
          - image: netbird-identity-proxy
            dockerfile: deploy/netbird/Dockerfile
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and publish
        uses: whereareiam/devops/actions/registry/docker-publish@v2
        with:
          visibility: public
          image: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: |
            ${{ needs.prepare.outputs.version }}
            dev
