# Dedicated host reached through a private NetBird HTTP proxy.
issuer: https://identity.example.com
listen: ":8080"
backchannel_listen: ":8081"
# Also enforce network isolation: only NetBird may reach port 8080.
trusted_proxy_cidrs: ["10.10.0.5/32"]
# Immutable account:principal IDs supplied by the patched NetBird proxy.
# Include only human principals explicitly linked to existing Authentik users.
principals: ["netbird-account-id:immutable-user-id"]
client:
  id: authentik-netbird
  secret: replace-with-at-least-32-random-bytes
  redirect_uri: https://auth.example.com/source/oauth/callback/netbird/
signing_key: /run/secrets/signing-key.pem
authorization_code_ttl_seconds: 60
token_ttl_seconds: 60
max_pending_codes: 1024
